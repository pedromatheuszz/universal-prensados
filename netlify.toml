# Netlify Configuration for Universal Prensados
# Hospedagem alternativa (a principal é a Vercel, em vercel.json). Publica o site dos clientes (site/) e a API (netlify/functions).
# O app de gestão (app/) é um programa de Windows e não é publicado aqui.
[build]
  command = "npm run build"
  publish = "site/dist"

# API de pedidos (Netlify Functions). Variáveis no painel do Netlify:
# DATABASE_URL (Neon) e SESSION_SECRET (32+ caracteres aleatórios)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Cabeçalhos de segurança: os mesmos do vercel.json (a CSP vale para todas as páginas,
# inclusive /pedido/; o index.html traz a mesma política em <meta>).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://viacep.com.br; frame-src https://www.google.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "0"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), browsing-topics=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Cross-Origin-Resource-Policy = "same-origin"
    X-Permitted-Cross-Domain-Policies = "none"

[[headers]]
  for = "/api/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/pedido/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Service-Worker-Allowed = "/"
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/optimized/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[dev]
  command = "npm run dev"
  targetPort = 3000