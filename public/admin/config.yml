# Decap CMS Configuration for Universal Prensados
# Access at: /admin/

backend:
  name: git-gateway
  branch: main
  commit_messages:
    create: 'Create {{collection}} "{{slug}}"'
    update: 'Update {{collection}} "{{slug}}"'
    delete: 'Delete {{collection}} "{{slug}}"'

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

site_url: https://universalprensados.com.br

# Local development backend (uncomment for local dev)
# backend:
#   name: test-repo

collections:
  # Products Collection
  - name: "products"
    label: "Produtos"
    folder: "public/data/products"
    extension: "json"
    format: "json"
    create: true
    slug: "{{id}}"
    fields:
      - {label: "ID", name: "id", widget: "string", required: true, pattern: ['^[a-z0-9_]+$', 'Apenas letras minúsculas, números e underscore']}
      - {label: "Nome", name: "name", widget: "string", required: true}
      - {label: "Categoria", name: "category", widget: "select", required: true, options: ["salgados", "especiais", "combos", "doces", "bebidas"]}
      - {label: "Preço (R$)", name: "price", widget: "number", required: true, min: 0, step: 0.01, value_type: "float"}
      - {label: "Descrição", name: "desc", widget: "text", required: true}
      - {label: "Imagem", name: "image", widget: "image", required: true, media_library: {config: {multiple: false}}}
      - {label: "Badge/Título", name: "badge", widget: "string", required: false}
      - {label: "Permite Adicionais", name: "hasExtras", widget: "boolean", default: true}
      - {label: "Ordem no cardápio", name: "order", widget: "number", required: false, value_type: "int", hint: "Menor aparece primeiro"}
      - {label: "Ativo", name: "active", widget: "boolean", default: true, required: false, hint: "Desmarque para esconder do cardápio"}

  # Site Settings
  - name: "settings"
    label: "Configurações do Site"
    files:
      - name: "general"
        label: "Configurações Gerais"
        file: "public/data/settings/general.json"
        fields:
          - {label: "Nome da Loja", name: "storeName", widget: "string", default: "Universal Prensados"}
          - {label: "Telefone WhatsApp", name: "whatsappPhone", widget: "string", default: "5547996366274"}
          - {label: "Endereço", name: "address", widget: "string", default: "Rua Monsenhor Gercino, 4486 — Jarivatuba / João Costa, Joinville - SC"}
          - {label: "Horário de Funcionamento", name: "businessHours", widget: "string", default: "Segunda a Sábado: 19:00 às 23:30"}
          - {label: "Email de Contato", name: "contactEmail", widget: "string", required: false}
          
      - name: "delivery"
        label: "Configurações de Entrega"
        file: "public/data/settings/delivery.json"
        fields:
          - {label: "Valor Mínimo para Frete Grátis (R$)", name: "freeShippingThreshold", widget: "number", default: 70, min: 0, step: 0.01}
          - {label: "Bairros e Taxas", name: "districts", widget: "list", fields:
              [
                {label: "Nome do Bairro", name: "name", widget: "string"},
                {label: "Taxa de Entrega (R$)", name: "fee", widget: "number", min: 0, step: 0.01},
                {label: "Slug (para matching ViaCEP)", name: "slug", widget: "string", hint: "Ex: jarivatuba, joao costa"}
              ]
            }
          
      - name: "coupons"
        label: "Cupons de Desconto"
        file: "public/data/settings/coupons.json"
        fields:
          - {label: "Cupons", name: "coupons", widget: "list", fields:
              [
                {label: "Código", name: "code", widget: "string", required: true},
                {label: "Desconto (%)", name: "discountPercent", widget: "number", required: true, min: 1, max: 100},
                {label: "Ativo", name: "active", widget: "boolean", default: true},
                {label: "Descrição", name: "description", widget: "text", required: false}
              ]
            }

  # Reviews/Depoimentos
  - name: "reviews"
    label: "Depoimentos"
    folder: "public/data/reviews"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Nome do Cliente", name: "author", widget: "string", required: true}
      - {label: "Localização", name: "location", widget: "string", required: true}
      - {label: "Avaliação (1-5)", name: "rating", widget: "number", required: true, min: 1, max: 5}
      - {label: "Texto do Depoimento", name: "text", widget: "text", required: true}
      - {label: "Data", name: "date", widget: "datetime", default: "", format: "YYYY-MM-DD"}
      - {label: "Publicado", name: "published", widget: "boolean", default: true}

  # Hero/Banner Settings
  - name: "hero"
    label: "Configurações do Hero"
    files:
      - name: "hero"
        label: "Hero Principal"
        file: "public/data/settings/hero.json"
        fields:
          - {label: "Título Principal", name: "title", widget: "string", default: "O Verdadeiro Lanche Prensado de Joinville."}
          - {label: "Subtítulo", name: "subtitle", widget: "text", default: "Pão crocante tostado no capricho, recheios generosos, bacon no ponto certo e molhos artesanais da casa."}
          - {label: "Texto do Status Badge", name: "statusText", widget: "string", default: "Aberto Hoje: 19:00 às 23:30 • Entrega em Joinville"}
          - {label: "Imagem do Card Destaque", name: "featuredImage", widget: "image", required: true}
          - {label: "Nome do Produto Destaque", name: "featuredProductName", widget: "string", default: "Dogzão Especial"}
          - {label: "Preço do Produto Destaque", name: "featuredProductPrice", widget: "number", default: 17.00}
          - {label: "Descrição do Produto Destaque", name: "featuredProductDesc", widget: "text", default: "Pão artesanal crocante prensado, milho, batata palha, salsicha, bacon crocante, calabresa defumada e maionese secreta da casa."}
          - {label: "ID do Produto Destaque (para botão)", name: "featuredProductId", widget: "string", default: "dogzao"}

  # About/Diferenciais Section
  - name: "about"
    label: "Seção Diferenciais"
    files:
      - name: "about"
        label: "Conteúdo Sobre Nós"
        file: "public/data/settings/about.json"
        fields:
          - {label: "Título", name: "title", widget: "string", default: "O padrão inconfundível de Joinville"}
          - {label: "Texto Principal 1", name: "description1", widget: "text", default: "O Universal Prensados é tradição na região de Jarivatuba e João Costa. Cada lanche prensado passa pela nossa chapa bem quente para garantir aquela crocância externa irresistível com o recheio cremoso e generoso por dentro."}
          - {label: "Texto Principal 2", name: "description2", widget: "text", default: "Trabalhamos com ingredientes selecionados: salsichas de primeira linha, bacon defumado crocante de verdade, frango desfiado temperado artesanalmente e nossa maionese especial temperada."}
          - {label: "Imagem do Banner", name: "bannerImage", widget: "image", required: true}
          - {label: "Features/Diferenciais", name: "features", widget: "list", fields:
              [
                {label: "Ícone (emoji)", name: "icon", widget: "string"},
                {label: "Título", name: "title", widget: "string"},
                {label: "Descrição", name: "description", widget: "text"}
              ]
            }
          - {label: "Avaliação", name: "rating", widget: "object", fields:
              [
                {label: "Nota (ex: 4.8)", name: "score", widget: "string"},
                {label: "Total de Avaliações", name: "count", widget: "string"},
                {label: "Texto Complementar", name: "text", widget: "string"}
              ]
            }