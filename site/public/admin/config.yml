# Decap CMS Configuration for Universal Prensados
# Access at: /admin/

backend:
  name: git-gateway
  branch: main
  commit_messages:
    create: 'Create {{collection}} "{{slug}}"'
    update: 'Update {{collection}} "{{slug}}"'
    delete: 'Delete {{collection}} "{{slug}}"'

# Caminhos relativos à raiz do repositório (o site fica em site/).
# Cardápio, preços, bairros, cupons e horários NÃO ficam mais aqui:
# são editados no app de gestão (pasta app/) e gravados no banco.
media_folder: "site/public/images/uploads"
public_folder: "/images/uploads"

site_url: https://universalprensados.com.br

# Local development backend (uncomment for local dev)
# backend:
#   name: test-repo

collections:
  - name: "general"
    label: "Informações da Loja"
    files:
      - name: "general"
        label: "Contato e endereço"
        file: "site/public/data/settings/general.json"
        fields:
          - {label: "Endereço", name: "address", widget: "string"}
          - {label: "Horário (texto de exibição)", name: "businessHours", widget: "string"}
          - {label: "Email de Contato", name: "contactEmail", widget: "string", required: false}

  # Reviews/Depoimentos
  - name: "reviews"
    label: "Depoimentos"
    folder: "site/public/data/reviews"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Nome do Cliente", name: "author", widget: "string", required: true}
      - {label: "Localização", name: "location", widget: "string", required: true}
      - {label: "Avaliação (1-5)", name: "rating", widget: "number", required: true, min: 1, max: 5}
      - {label: "Texto do Depoimento", name: "text", widget: "text", required: true}
      - {label: "Data", name: "date", widget: "datetime", default: "", format: "YYYY-MM-DD"}
      - {label: "Publicado", name: "published", widget: "boolean", default: true}

  # Hero/Banner Settings
  - name: "hero"
    label: "Configurações do Hero"
    files:
      - name: "hero"
        label: "Hero Principal"
        file: "site/public/data/settings/hero.json"
        fields:
          - {label: "Título Principal", name: "title", widget: "string", default: "O Verdadeiro Lanche Prensado de Joinville."}
          - {label: "Subtítulo", name: "subtitle", widget: "text", default: "Pão crocante tostado no capricho, recheios generosos, bacon no ponto certo e molhos artesanais da casa."}
          - {label: "Texto do Status Badge", name: "statusText", widget: "string", default: "Aberto Hoje: 19:00 às 23:30 • Entrega em Joinville"}
          - {label: "Imagem do Card Destaque", name: "featuredImage", widget: "image", required: true}
          - {label: "Nome do Produto Destaque", name: "featuredProductName", widget: "string", default: "Dogzão Especial"}
          - {label: "Preço do Produto Destaque", name: "featuredProductPrice", widget: "number", default: 17.00}
          - {label: "Descrição do Produto Destaque", name: "featuredProductDesc", widget: "text", default: "Pão artesanal crocante prensado, milho, batata palha, salsicha, bacon crocante, calabresa defumada e maionese secreta da casa."}
          - {label: "ID do Produto Destaque (para botão)", name: "featuredProductId", widget: "string", default: "dogzao"}

  # About/Diferenciais Section
  - name: "about"
    label: "Seção Diferenciais"
    files:
      - name: "about"
        label: "Conteúdo Sobre Nós"
        file: "site/public/data/settings/about.json"
        fields:
          - {label: "Título", name: "title", widget: "string", default: "O padrão inconfundível de Joinville"}
          - {label: "Texto Principal 1", name: "description1", widget: "text", default: "O Universal Prensados é tradição na região de Jarivatuba e João Costa. Cada lanche prensado passa pela nossa chapa bem quente para garantir aquela crocância externa irresistível com o recheio cremoso e generoso por dentro."}
          - {label: "Texto Principal 2", name: "description2", widget: "text", default: "Trabalhamos com ingredientes selecionados: salsichas de primeira linha, bacon defumado crocante de verdade, frango desfiado temperado artesanalmente e nossa maionese especial temperada."}
          - {label: "Imagem do Banner", name: "bannerImage", widget: "image", required: true}
          - {label: "Features/Diferenciais", name: "features", widget: "list", fields:
              [
                {label: "Ícone (emoji)", name: "icon", widget: "string"},
                {label: "Título", name: "title", widget: "string"},
                {label: "Descrição", name: "description", widget: "text"}
              ]
            }
          - {label: "Avaliação", name: "rating", widget: "object", fields:
              [
                {label: "Nota (ex: 4.8)", name: "score", widget: "string"},
                {label: "Total de Avaliações", name: "count", widget: "string"},
                {label: "Texto Complementar", name: "text", widget: "string"}
              ]
            }